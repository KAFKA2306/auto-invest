version: "3"

tasks:
  install:
    cmds:
      - npm ci
      - uv sync --locked
  dev:
    cmds:
      - PORT=${PORT:-4173} npm run dev -- --host --port ${PORT:-4173}
  lint:
    cmds:
      - npm run lint
      - uv run ruff check scripts
  build:
    cmds:
      - npm run build
  check:
    cmds:
      - npm run check
  update:
    cmds:
      - npm run update
  update:all:
    cmds:
      - npm run update
  clean:
    cmds:
      - rm -rf dist dist-ssr .vite .turbo .cache
